name: Build Android APK (Private)

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant (release or debug)'
        required: false
        default: 'release'

jobs:
  build-apk:
    name: Compile Signed Svorrent.apk
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 5. Generate signing keystore
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore svorrent-release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias svorrent \
            -storepass svorrent123 \
            -keypass svorrent123 \
            -dname "CN=Svorrent, OU=Engineering, O=Svorrent, L=IN, S=IN, C=IN"

      - name: 6. Build Signed Release APK
        working-directory: android
        env:
          SVORRENT_KEYSTORE_PATH: ${{ github.workspace }}/android/svorrent-release.keystore
          SVORRENT_KEYSTORE_PASS: svorrent123
          SVORRENT_KEY_ALIAS: svorrent
          SVORRENT_KEY_PASS: svorrent123
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Svorrent.apk
          ls -lh Svorrent.apk

      - name: 7. Upload Private APK Artifact (Logged-in GitHub Account Only)
        uses: actions/upload-artifact@v4
        with:
          name: Svorrent-Android-APK
          path: android/Svorrent.apk
          retention-days: 30
          if-no-files-found: error
