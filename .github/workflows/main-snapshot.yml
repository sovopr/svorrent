name: Signed macOS main build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-main-build
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build frontend and install backend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build
          cd ../backend
          npm ci
          npm test

      - name: Check signing and notarization secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for required in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing $required; cannot publish a signed main-snapshot build"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: steps.signing.outputs.ready == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for required in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY KEYCHAIN_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "Missing $required; refusing to publish an unsigned main build" >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/svorrent-signing.keychain-db"
          certificate="$RUNNER_TEMP/svorrent-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security default-keychain -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain"

      - name: Build and notarize main commit
        if: steps.signing.outputs.ready == 'true'
        env:
          SVORRENT_SOURCE_COMMIT: ${{ github.sha }}
          SVORRENT_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for required in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "Missing $required; refusing to publish an unnotarized main build" >&2
              exit 1
            fi
          done
          ./scripts/build-dmg.sh
          codesign --verify --deep --strict --verbose=2 dist-app/Svorrent.app
          xcrun notarytool submit dist-app/Svorrent.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple dist-app/Svorrent.dmg
          xcrun stapler validate dist-app/Svorrent.dmg

      - name: Publish installable build for this main commit
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="dist-app/Svorrent-${GITHUB_SHA}.dmg"
          mv dist-app/Svorrent.dmg "$asset"
          if gh release view main-snapshot >/dev/null 2>&1; then
            gh release upload main-snapshot "$asset" --clobber
          else
            gh release create main-snapshot "$asset" \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Svorrent main builds' \
              --notes 'Signed and notarized builds of upstream main. The app selects the asset matching the latest main commit.'
          fi
          # Keep a few older builds so an in-progress download is not removed.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/main-snapshot" \
            --jq '.assets | sort_by(.created_at) | reverse | .[5:] | .[].id' |
          while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.ready == 'true'
        run: security delete-keychain "$RUNNER_TEMP/svorrent-signing.keychain-db" 2>/dev/null || true
