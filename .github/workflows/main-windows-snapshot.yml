name: Signed Windows main build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-windows-main-build
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build and test application
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency install failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Frontend lint failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          Pop-Location
          Push-Location backend
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Backend dependency install failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed' }
          Pop-Location

      - name: Check Windows signing secrets
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          SVORRENT_WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64 -or -not $env:SVORRENT_WINDOWS_PFX_PASSWORD) {
            throw 'Missing Windows signing secrets; cannot publish a signed Windows main build'
          } else {
            "ready=true" >> $env:GITHUB_OUTPUT
          }

      - name: Install NSIS
        if: steps.signing.outputs.ready == 'true'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build and sign installer
        if: steps.signing.outputs.ready == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          SVORRENT_WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64 -or -not $env:SVORRENT_WINDOWS_PFX_PASSWORD) {
            throw 'Windows signing secrets are missing; refusing to publish an unsigned installer'
          }
          $env:SVORRENT_WINDOWS_PFX = Join-Path $env:RUNNER_TEMP 'svorrent-signing.pfx'
          [IO.File]::WriteAllBytes($env:SVORRENT_WINDOWS_PFX, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:SVORRENT_WINDOWS_PFX, $env:SVORRENT_WINDOWS_PFX_PASSWORD)
          $thumbprint = $certificate.Thumbprint.ToUpperInvariant()
          & ./scripts/build-windows-snapshot.ps1 -SourceCommit '${{ github.sha }}' -SignerThumbprint $thumbprint
          $asset = Join-Path $PWD "dist-win\Svorrent-$env:GITHUB_SHA-Setup.exe"
          Move-Item 'dist-win\Svorrent-Setup.exe' $asset
          $signature = Get-AuthenticodeSignature -LiteralPath $asset
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -cne $thumbprint) {
            throw 'Final installer signature verification failed'
          }
          Remove-Item -LiteralPath $env:SVORRENT_WINDOWS_PFX -Force

      - name: Publish installable build for this main commit
        if: steps.signing.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist-win/Svorrent-$env:GITHUB_SHA-Setup.exe"
          gh release view main-windows-snapshot *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload main-windows-snapshot $asset --clobber
          } else {
            gh release create main-windows-snapshot $asset --target $env:GITHUB_SHA --prerelease `
              --title 'Svorrent Windows main builds' `
              --notes 'Signed Windows installers of upstream main. The app selects the asset matching the latest main commit.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the Windows installer failed' }
          $ids = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/main-windows-snapshot" `
            --jq '.assets | sort_by(.created_at) | reverse | .[5:] | .[].id'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list Windows main builds' }
          foreach ($id in $ids) {
            if ($id) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$id"
              if ($LASTEXITCODE -ne 0) { throw "Could not prune asset $id" }
            }
          }
