name: Verified unsigned release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    name: Test release source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Check tag and package versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const tag=process.env.RELEASE_TAG; for(const dir of ['backend','frontend']) { const version=JSON.parse(fs.readFileSync(dir+'/package.json')).version; if(tag !== 'v'+version) { console.error(dir+' version '+version+' does not match '+tag); process.exitCode=1; } }"
      - name: Install, lint, and test frontend
        shell: bash
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Install and test backend
        shell: bash
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Install FFmpeg for real-media integration test
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then exit 0; fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg --yes --no-progress ;;
          esac
      - name: Verify synthetic torrent download and media playback
        working-directory: backend
        run: npm run test:e2e

  macos:
    name: Build ad-hoc signed Mac DMG (not notarized)
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install dependencies
        run: |
          brew install librsvg
          (cd frontend && npm ci)
          (cd backend && npm ci)
      - name: Build and verify ad-hoc signed DMG
        env:
          SVORRENT_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/build-dmg.sh
          codesign --verify --deep --strict --verbose=2 dist-app/Svorrent.app
          identity="$(codesign -dv --verbose=4 dist-app/Svorrent.app 2>&1 | sed -n 's/^Signature=//p')"
          test "$identity" = adhoc
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist-app/Svorrent.dmg
          if-no-files-found: error
  windows:
    name: Build unsigned Windows packages
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install dependencies and build frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          Pop-Location
          Push-Location backend
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Backend install failed' }
          Pop-Location
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Build and verify unsigned installer
        shell: pwsh
        run: |
          & ./scripts/build-windows-snapshot.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $signature = Get-AuthenticodeSignature -LiteralPath 'dist-win/Svorrent-Setup.exe'
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned installer, got $($signature.Status)"
          }
          Compress-Archive -Path 'dist-win/staging/*' -DestinationPath 'dist-win/Svorrent-Windows-x64-Portable.zip'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            dist-win/Svorrent-Setup.exe
            dist-win/Svorrent-Windows-x64-Portable.zip
          if-no-files-found: error

  publish:
    name: Publish verified unsigned packages
    runs-on: ubuntu-latest
    needs: [verify, macos, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: windows-packages
          path: release
      - name: Fetch latest Svorrent.apk if available
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo sovopr/svorrent-android --pattern "Svorrent.apk" --clobber || gh release download --repo "$GITHUB_REPOSITORY" --pattern "Svorrent.apk" --clobber || true
      - name: Check package set and create checksums
        working-directory: release
        run: |
          set -euo pipefail
          for asset in Svorrent.dmg Svorrent-Setup.exe Svorrent-Windows-x64-Portable.zip; do
            test -s "$asset"
          done
          sha256sum Svorrent.dmg Svorrent-Setup.exe Svorrent-Windows-x64-Portable.zip $(test -f Svorrent.apk && echo Svorrent.apk || true) > SHA256SUMS.txt
      - name: Publish a new release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; refusing to replace published assets"
            exit 1
          fi
          gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" release/* --verify-tag --title "$GITHUB_REF_NAME" --notes "Verified macOS, Windows, and Android packages for $GITHUB_REF_NAME with SHA-256 checksums."
