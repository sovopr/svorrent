<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <!-- Dark Neutral Background Gradient (Svorrent webapp palette, strictly no neon blue hue) -->
    <radialGradient id="neutralDepth" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1c1d20" />
      <stop offset="60%" stop-color="#131416" />
      <stop offset="100%" stop-color="#0e0f10" />
    </radialGradient>

    <!-- Subtle Technical Grid (Neutral dark slate lines, not blue) -->
    <pattern id="cleanGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25262b" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="1" fill="#383a42" fill-opacity="0.4" />
    </pattern>

    <!-- Card Background: Sleek elevated dark surface with subtle depth -->
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b1e" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>

    <!-- App Logo Gradient: Clean Svorrent cobalt (#4b7cd8 to #3b68c2) -->
    <linearGradient id="brandLogoGrad" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b8dee" />
      <stop offset="100%" stop-color="#406ec5" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="640" fill="url(#neutralDepth)" />
  <rect width="1280" height="640" fill="url(#cleanGrid)" />

  <!-- Subtle outer border frame -->
  <rect x="24" y="24" width="1232" height="592" rx="12" fill="none" stroke="#2a2c30" stroke-width="1" />

  <!-- Top Hero Header: Logo + Title + Open Source badge -->
  <g transform="translate(80, 72)">
    <!-- App Logo Icon -->
    <rect width="88" height="88" rx="18" fill="url(#brandLogoGrad)" />
    <!-- Sigma Path -->
    <path d="M 62 26 L 26 26 L 48 44 L 26 62 L 62 62" fill="none" stroke="#101113" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Title -->
    <text x="112" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="58" font-weight="700" fill="#f3f4f6" letter-spacing="-1.5">Svorrent</text>

    <!-- Open Source Tag -->
    <rect x="390" y="26" width="118" height="28" rx="14" fill="#202227" stroke="#373940" stroke-width="1" />
    <text x="449" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="1">OPEN SOURCE</text>
  </g>

  <!-- Hero Taglines (Balanced hierarchy from previous layout) -->
  <g transform="translate(80, 204)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700" fill="#e5e7eb" letter-spacing="-0.5">
      Desktop &amp; Mobile Torrent Engine
    </text>
    <text y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="400" fill="#9ca3af">
      Multi-network bandwidth bonding · Sequential piece streaming · Swarm telemetry
    </text>
  </g>

  <!-- 3 Feature Cards (Wide, sleek proportions) -->
  <g transform="translate(80, 314)">
    <!-- Card 1: Multi-Source Search -->
    <g transform="translate(0, 0)">
      <rect width="346" height="136" rx="10" fill="url(#cardSurface)" stroke="#282a2e" stroke-width="1" />
      <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#f3f4f6">Multi-Source Search</text>
      <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#9ca3af">Query public torrent indexers with bounded</text>
      <text x="24" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#9ca3af">timeouts and DNS-over-HTTPS anti-censorship.</text>
    </g>

    <!-- Card 2: Network Bonding -->
    <g transform="translate(386, 0)">
      <rect width="346" height="136" rx="10" fill="url(#cardSurface)" stroke="#282a2e" stroke-width="1" />
      <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#f3f4f6">Network Bonding</text>
      <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#9ca3af">Pool Wi-Fi and Mobile Data (5G/LTE) adapters</text>
      <text x="24" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#9ca3af">simultaneously for multiplied transfer speed.</text>
    </g>

    <!-- Card 3: Buffer-Free Streaming -->
    <g transform="translate(772, 0)">
      <rect width="348" height="136" rx="10" fill="url(#cardSurface)" stroke="#282a2e" stroke-width="1" />
      <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#f3f4f6">Buffer-Free Streaming</text>
      <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#9ca3af">Sequential piece scheduling and container checks</text>
      <text x="24" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#9ca3af">enable instant video playback in VLC.</text>
    </g>
  </g>

  <!-- Bottom Platform Bar -->
  <g transform="translate(80, 516)">
    <!-- Platform Pills (Neutral dark slate) -->
    <rect x="0" y="0" width="84" height="34" rx="6" fill="#18191c" stroke="#2c2d32" stroke-width="1" />
    <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e5e7eb" text-anchor="middle">macOS</text>

    <rect x="96" y="0" width="94" height="34" rx="6" fill="#18191c" stroke="#2c2d32" stroke-width="1" />
    <text x="143" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e5e7eb" text-anchor="middle">Windows</text>

    <rect x="202" y="0" width="88" height="34" rx="6" fill="#18191c" stroke="#2c2d32" stroke-width="1" />
    <text x="246" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e5e7eb" text-anchor="middle">Android</text>

    <!-- Clean Repo Link on right -->
    <text x="1120" y="22" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6b7280" text-anchor="end">github.com/sovopr/svorrent</text>
  </g>
</svg>
