<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <!-- Solid webapp background (#121314) -->
  <rect width="1280" height="640" fill="#121314" />

  <!-- Subtle outer frame -->
  <rect x="24" y="24" width="1232" height="592" rx="10" fill="none" stroke="#2a2b2f" stroke-width="1" />

  <!-- Brand Section (Top Left) -->
  <g transform="translate(80, 76)">
    <!-- App Logo Icon -->
    <rect width="84" height="84" rx="14" fill="#5b8dee" />
    <!-- Sigma Icon -->
    <path d="M 59 25 L 25 25 L 45 42 L 25 59 L 59 59" fill="none" stroke="#121314" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Project Title -->
    <text x="108" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" fill="#e7e7e5" letter-spacing="-1">Svorrent</text>

    <!-- Subtitle -->
    <text x="108" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="400" fill="#a3a4a8">BitTorrent client with multi-network bonding and instant playback</text>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="216" x2="1200" y2="216" stroke="#2a2b2f" stroke-width="1" />

  <!-- 3 Feature Cards in exact requested order: Search -> Network Bonding -> Buffer-Free Streaming -->
  <g transform="translate(80, 260)">
    <!-- Card 1: Multi-Source Search -->
    <g transform="translate(0, 0)">
      <rect width="346" height="186" rx="8" fill="#17181a" stroke="#2a2b2f" stroke-width="1" />
      <text x="24" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#e7e7e5">Multi-Source Search</text>
      <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a3a4a8">Query public torrent indexers</text>
      <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a3a4a8">with bounded timeouts and DNS-</text>
      <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a3a4a8">over-HTTPS anti-censorship fallback.</text>
    </g>

    <!-- Card 2: Network Bonding -->
    <g transform="translate(386, 0)">
      <rect width="346" height="186" rx="8" fill="#17181a" stroke="#2a2b2f" stroke-width="1" />
      <text x="24" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#e7e7e5">Network Bonding</text>
      <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a3a4a8">Route peer connections across</text>
      <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a3a4a8">Wi-Fi and Mobile Data (5G/LTE)</text>
      <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a3a4a8">simultaneously for pooled speed.</text>
    </g>

    <!-- Card 3: Buffer-Free Streaming -->
    <g transform="translate(772, 0)">
      <rect width="348" height="186" rx="8" fill="#17181a" stroke="#2a2b2f" stroke-width="1" />
      <text x="24" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#e7e7e5">Buffer-Free Streaming</text>
      <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a3a4a8">Sequential piece scheduler and</text>
      <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a3a4a8">playback readiness checks allow</text>
      <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a3a4a8">instant video playback in VLC.</text>
    </g>
  </g>

  <!-- Bottom Platform Bar (macOS, Windows, Android) -->
  <g transform="translate(80, 510)">
    <!-- Platform Pills -->
    <rect x="0" y="0" width="86" height="34" rx="6" fill="#1d1e21" stroke="#2a2b2f" stroke-width="1" />
    <text x="43" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e7e7e5" text-anchor="middle">macOS</text>

    <rect x="98" y="0" width="94" height="34" rx="6" fill="#1d1e21" stroke="#2a2b2f" stroke-width="1" />
    <text x="145" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e7e7e5" text-anchor="middle">Windows</text>

    <rect x="204" y="0" width="88" height="34" rx="6" fill="#1d1e21" stroke="#2a2b2f" stroke-width="1" />
    <text x="248" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e7e7e5" text-anchor="middle">Android</text>

    <!-- Clean Repo Link on right -->
    <text x="1120" y="22" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#92949b" text-anchor="end">github.com/sovopr/svorrent</text>
  </g>
</svg>
